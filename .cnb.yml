# CNB 云原生构建流水线：镜像 .github/workflows/ci.yml 的门禁
# （rustfmt + Clippy + 测试 + 构建检查 + npm audit），外加 CNB 官方 SCA 安全扫描。
# GitHub Actions 工作流只在 GitHub 侧执行；CNB 侧由本文件驱动，
# push / PR 到 main 时自动触发（仓库设置已开 auto_trigger）。
# main 块的两条流水线（rust / npm-audit）并行执行，与 ci.yml 的并行 job 对齐；
# 末尾的 `**` 块给所有分支带来 SCA 扫描（漏洞 / License / SBOM），并在分支链的
# PR 上复用 main 的 rust 门禁（push 不重复跑全量构建）。
# 平台级代码安全扫描（secrets + SCA）走仓库默认规则；这里的插件流水线额外补上
# PR 增量门禁与全量报告，两者互补而非重复。
#
# Mirrors .github/workflows/ci.yml. The GitHub Actions workflows only run on
# the GitHub side; this file drives the CNB cloud-native build. The two main
# pipelines (rust / npm-audit) run in parallel, matching ci.yml's parallel
# jobs, and the trailing `**` block adds SCA scanning (vulnerability /
# license / SBOM) to every branch, plus the main rust gate on branch-chain PRs
# (pushes skip the full build). The platform-level code security scan
# (secrets + SCA) keeps its repo defaults; these plugin pipelines add
# incremental PR gating and full reports on top, rather than duplicating it.

main:
  push:
    - &rust-ci
      name: rust
      docker:
        image: rust:1
      env:
        CARGO_TERM_COLOR: always
      stages:
        # Slint (winit + femtovg) + rfd (GTK) + arboard need these system libs.
        # Same list as ci.yml. The container runs as root, so no sudo here
        # (unlike GitHub-hosted runners).
        - name: Install Linux GUI dependencies
          script: |
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential pkg-config cmake \
              libfontconfig1-dev libfreetype6-dev \
              libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
              libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
              libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
              libudev-dev
        # The official rust image ships the stable toolchain without these
        # components (ci.yml adds them via dtolnay/rust-toolchain).
        - name: Add rustfmt + clippy components
          script: rustup component add rustfmt clippy
        - name: rustfmt --check
          script: cargo fmt --all -- --check
        - name: clippy
          script: cargo clippy --workspace --all-targets -- -D warnings
        - name: test (workspace)
          script: cargo test --workspace
        - name: build check
          script: cargo build --workspace
        # 遥测门禁（docs/AI_PANEL_REQUIREMENTS.md §6.1 的 P0-N1）：禁止遥测/埋点/
        # 使用统计/崩溃上报。"禁止"写进文档不够，这里给它一个可机械校验的形式。
        - name: no telemetry scan
          script: sh scripts/check-no-telemetry.sh
    - &npm-audit-ci
      name: npm-audit
      docker:
        image: node:24
      stages:
        # The vendored rssh snapshot is reference-only, but its committed
        # package-lock.json is scanned by CNB code scanning - any published
        # advisory in the lock file must fail the build.
        - name: npm audit (rssh snapshot)
          script: |
            cd third_party/rssh
            npm audit
  pull_request:
    - *rust-ci
    - *npm-audit-ci

# ── CNB 官方 SCA 安全扫描（漏洞 / License / SBOM）───────────────────────────
# `**` 匹配所有分支，因此 main 之外的分支链（auto/*、m2、work-m3 …）也会被扫描，
# 不会因为最终才 PR 到 main 就一路绕过检查。
#
# push 走全量扫描并上传报告，暂不设 failOnSeverity：Cargo.lock 里已有存量告警
# （见 audit.toml 记录的 russh 豁免），先看清全貌再决定把阈值收在哪里。
# PR 走 diff 增量模式，只拦本次新增的 High / Critical 漏洞与 High License 风险 ——
# 同一组件同一 CVE 不会重复阻断，存量历史不会把一个无关 PR 挡在门外。
#
# `**` matches every branch, so long-lived branch chains (auto/*, m2,
# work-m3, …) are scanned too instead of slipping past every check just
# because they only open a PR against main at the very end.
#
# Pushes run a full scan and publish the report, with no failOnSeverity yet:
# Cargo.lock already carries known findings (see the russh exemption in
# audit.toml), so the backlog is reported first and gated once triaged.
# PRs run in diff mode and gate only newly introduced High/Critical
# vulnerabilities and High license risks - the same component/CVE pair never
# blocks twice, so pre-existing findings cannot turn an unrelated PR red.
"**":
  push:
    - name: no-telemetry
      docker:
        image: alpine:3
      stages:
        - name: 遥测关键字扫描
          script: sh scripts/check-no-telemetry.sh
    - name: sca-full
      stages:
        - name: 开源组件漏洞全量扫描
          image: cnbcool/sca-vulnerability:latest
          timeout: 15m
          settings:
            scanMode: full
            publish: true
        - name: License 全量扫描
          image: cnbcool/sca-license:latest
          timeout: 15m
          settings:
            scanMode: full
            publish: true
        - name: 生成 SBOM
          image: cnbcool/sca-sbom:latest
          timeout: 15m
          settings:
            scanMode: full
            publish: true
  pull_request.target:
    # 分支链上的 PR 不走 main 的 rust 流水线，这里复用同一锚点补齐 fmt / clippy /
    # test / build 门禁；push 块仍只做 SCA + 遥测，避免每次推送都跑全量构建。
    - *rust-ci
    # 遥测门禁同样挂在所有分支上：只挂 main 的话这条约束在长分支上形同虚设。
    - name: no-telemetry
      docker:
        image: alpine:3
      stages:
        - name: 遥测关键字扫描
          script: sh scripts/check-no-telemetry.sh
    - name: sca-gate
      stages:
        - name: 开源组件漏洞增量门禁
          image: cnbcool/sca-vulnerability:latest
          timeout: 15m
          settings:
            failOnSeverity: high
        - name: License 增量门禁
          image: cnbcool/sca-license:latest
          timeout: 15m
          settings:
            failOnSeverity: high
