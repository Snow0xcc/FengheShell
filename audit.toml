# cargo-audit configuration (https://rustsec.org).
#
# ── RUSTSEC-2026-0154 — russh "unbounded 32-bit allocation" (DoS), russh < 0.60.3 ──
#
# The flaw is in russh's SSH-AGENT frame parsing: it accepts an unchecked frame
# length from a peer and allocates before validating, so a malicious peer can
# force a large allocation (denial of service). The fix caps the agent frame at
# 256 KiB.
#
# fengheshell does NOT use the ssh-agent in any way — no agent authentication, no
# agent forwarding, no SSH_AUTH_SOCK handling anywhere in src/ or crates/. The
# vulnerable code path is therefore never reached in this binary, so the advisory
# is not exploitable here. (Re-verified 2026-10-27: zero hits.)
#
# ── Why we are still on 0.49 (reason re-checked 2026-10-27) ──────────────────
#
# The first version of this file justified holding back on *pre-release* crypto
# (ed25519-dalek 3.0.0-pre, curve25519-dalek 5.0.0-pre, aes-gcm 0.11.0-rc). That
# part is now obsolete: ed25519-dalek 3.0.0, curve25519-dalek 5.0.0 and
# aes-gcm 0.11.1 have all shipped.
#
# What has NOT left the pre-release channel is the key-format side. russh 0.65.0
# (current stable) still pins ssh-key =0.7.0-rc.11, rsa =0.10.0-rc.18 and
# pkcs1 =0.8.0-rc.4, while the newest stable releases are ssh-key 0.6.7,
# rsa 0.9.10 and pkcs1 0.7.5. This crate also depends on ssh-key directly at
# "0.6", so upgrading russh would drag that direct dependency onto an rc too.
#
# net: the trade moved, it did not disappear — the Dalek/AEAD crypto is audited
# now, but the key-format / RSA stack is still release-candidate code, and that
# is the part an SSH client leans on for host keys and private keys.
#
# Decision: keep the exemption while the DoS stays unreachable, and re-open the
# upgrade when any of these happens —
#   1. ssh-key 0.7 / rsa 0.10 / pkcs1 0.8 leave the rc channel; or
#   2. a *reachable* russh advisory appears (this one is not, see above).
# Migration scope measured 2026-10-27: 56 `russh::` references across 8 files
# (src/ssh/impls/ssh.rs alone has 33) plus 9 `ssh_key::` references across 3
# files — a real but bounded migration, worth its own PR (cf. PR #151 for the
# shape of it). Do not bundle it with an unrelated dependency patch.
[advisories]
ignore = ["RUSTSEC-2026-0154"]
